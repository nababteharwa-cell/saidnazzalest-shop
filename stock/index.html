<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مخزون سعيد نزال</title>
<link rel="icon" href="/icons/stock-192.png">
<link rel="manifest" href="/stock/stock.webmanifest">
<meta name="theme-color" content="#1B2D5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SN Stock">
<link rel="apple-touch-icon" href="/icons/apple-stock.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* A working tool for the showroom floor: navy and gold from the SN logo, big touch targets, numbers first. */
:root{--bg:#F3F4F7;--ink:#141A2E;--mute:#646B7E;--line:#E3E6EE;--navy:#1B2D5B;--gold:#C9973B;--goldInk:#7A5517;--ok:#1E7A4C;--bad:#B3261E;--r:14px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:8px max(3vw,12px);display:flex;align-items:center;gap:12px}
header img{width:38px;height:38px;border-radius:50%;background:#fff}
header b{font-size:17px}
header .who{margin-inline-start:auto;font-size:13px;color:#C9D1E6;text-align:end;line-height:1.3}
nav.tabs{position:sticky;top:54px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 max(3vw,8px)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;min-height:48px;color:var(--mute);font-weight:500}
.tab.on{color:var(--navy);border-color:var(--gold);font-weight:700}
main{max-width:1200px;margin:auto;padding:18px max(3vw,12px) 90px}
h2{font-size:21px;margin:0 0 12px}
h3{font-size:17px;margin:18px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 0 var(--line);text-align:start;border:0}
button.kpi:hover{box-shadow:0 0 0 2px var(--gold)}
.kpi b{display:block;font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:13.5px;color:var(--mute)}
.kpi.warn b{color:var(--bad)}
.card{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 0 var(--line);margin-bottom:12px}
.note{font-size:13.5px;color:var(--mute)}
.warnbox{background:#C9973B1f;color:var(--goldInk);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.errbox{background:#B3261E14;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.okbox{background:#1E7A4C17;color:var(--ok);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;background:var(--navy);color:#fff}
.btn:hover{background:#24397A}
.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold)}
.btn.bad{background:var(--bad)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 3px #1B2D5B1a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line);gap:2px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:999px;padding:8px 12px;min-height:40px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:500;background:#FAFBFC}
td.n,th.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F8FB}
.neg{color:var(--bad);font-weight:700}.low{color:var(--goldInk);font-weight:700}.zero{color:var(--mute)}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12.5px;background:var(--bg);color:var(--mute);white-space:nowrap}
.tag.k-pos_sale,.tag.k-online_sale,.tag.k-social_sale{background:#1B2D5B14;color:var(--navy)}
.tag.k-purchase,.tag.k-pos_purchase,.tag.k-return,.tag.k-online_return{background:#1E7A4C17;color:var(--ok)}
.tag.k-adjust,.tag.k-void{background:#B3261E14;color:var(--bad)}
.tag.k-count{background:#C9973B26;color:var(--goldInk)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--mute);direction:ltr;unicode-bidi:isolate}
.search{position:relative}
.drop{position:absolute;inset-inline:0;top:100%;z-index:15;background:#fff;border-radius:12px;box-shadow:0 12px 40px #0002;max-height:340px;overflow:auto;margin-top:4px}
.drop button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;min-height:48px}
.drop button:hover,.drop button.hi{background:#F3F4F7}
.line.fcl{grid-template-columns:minmax(0,1fr) 92px 56px 36px!important;gap:6px}.line.fcl .n{font-size:13px;white-space:nowrap}
.line{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff}
.qbox button{width:38px;height:42px;border:0;background:none;font-size:18px}
.qbox input{border:0!important;box-shadow:none!important;text-align:center;padding:4px;min-height:42px;width:100%}
.x{background:var(--bg);border:0;width:38px;height:38px;border-radius:50%;font-size:20px}
.veil{position:fixed;inset:0;background:#141A2E66;z-index:40;display:none}.veil.on{display:block}
.modal{position:fixed;z-index:50;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(720px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;display:none;box-shadow:0 30px 80px #0003}
.modal.on{display:block}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mh h2{margin:0;font-size:18px}
.mb{padding:14px 18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.bar{position:sticky;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);margin:12px calc(-1*max(3vw,12px)) 0;padding:10px max(3vw,12px);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cam{position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column}.cam.on{display:flex}
.cam video{flex:1;object-fit:cover;width:100%}
.cam .row{padding:12px;justify-content:center}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.login{max-width:380px;margin:60px auto}
.login img{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
#today,#rr,#ih,#ul,#th,#cl .card,#il{overflow-x:auto}
@media(max-width:700px){
 header b{font-size:15px}header .who{font-size:12px}
 .split{grid-template-columns:1fr}
 .line{grid-template-columns:minmax(0,1fr) 104px 40px;}
 .line .pr{grid-column:1/3}
 table.stack thead{display:none}table.stack tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:8px 6px;border-bottom:1px solid var(--line)}
 table.stack td{border:0;padding:2px 6px}table.stack td.hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="/stock/catalog.js"></script>
</head>
<body>
<header><img src="/photos/b-logo.jpg" alt=""><b>مخزون سعيد نزال</b><div class="who" id="who"></div></header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="app"><div class="empty">…</div></main>
<div class="veil" id="veil"></div><div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="cam" id="cam"><video id="camv" playsinline muted></video><div class="row"><span style="color:#fff" id="camt">وجّه الكاميرا على الباركود</span><button class="btn alt" id="camx">إغلاق</button></div></div>
<script>
{
const CFG=window.SN_CONFIG||{};
const sb=window.supabase&&CFG.url?window.supabase.createClient(CFG.url,CFG.anonKey):null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const latin=s=>String(s??'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776);
const norm=s=>latin(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const num=x=>{const n=parseFloat(latin(x).replace(/[٫]/g,'.').replace(/[^\d.\-]/g,''));return isNaN(n)?null:n};
const fq=n=>n==null?'—':(+n%1?(+n).toFixed(2).replace(/\.?0+$/,''):String(+n));
const fm=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:3,minimumFractionDigits:0})+' د.أ';
const fd=d=>d?new Date(d).toLocaleString('ar-JO',{dateStyle:'short',timeStyle:'short'}):'—';
const fday=d=>d?new Date(d).toLocaleDateString('ar-JO',{dateStyle:'medium'}):'—';
const toast=(m,ms=2200)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms)};
const ERR={owner_only:'هذه العملية لصاحب الحساب فقط',not_allowed:'ما عندك صلاحية',bad_qty:'كمية غير صحيحة',reason_required:'اكتب سبب التسوية',need_opening:'أول استيراد لازم يكون رصيد افتتاحي',no_such_login:'ما في حساب دخول بهالإيميل – أنشئه أولاً من Supabase',cannot_void:'ما بينفع إلغاء هالحركة',use_order_status:'حركات الموقع تُلغى من حالة الطلب في لوحة المتجر',cannot_remove_self:'ما بتقدر تشيل حسابك',cannot_demote_self:'ما بتقدر تغيّر صلاحيتك',no_item:'الصنف غير موجود',ledger_is_permanent:'سجل الحركات ما بينعدّل',no_place:'اختار وين عم تعدّ أولاً',no_lines:'ما في أسطر',bad_qty:'كمية غير صحيحة',count_already_open:'في جرد مفتوح – اعتمده أو ألغيه أولاً',no_aisles:'أضف الممرات من تبويب الأماكن أولاً',aisle_in_use:'في أصناف مكانها بهالممر – انقلها أولاً',bad_loc:'عنوان الرف غير موجود بالممرات',count_closed:'الجرد مسكّر',no_zone:'الممر مش بالجرد'};
const emsg=e=>{const m=(e&&e.message)||String(e);const k=Object.keys(ERR).find(k=>m.includes(k));return k?ERR[k]:'صار خطأ: '+m};
const KIND={opening:'رصيد افتتاحي',pos_sale:'بيع كاشير (ترست)',pos_purchase:'شراء (ترست)',online_sale:'بيع الموقع',online_return:'إرجاع طلب موقع',social_sale:'بيع مباشر / سوشال',purchase:'استلام بضاعة',return:'مرتجع زبون',adjust:'تسوية',count:'جرد',void:'إلغاء حركة'};
const CH={instagram:'انستغرام',facebook:'فيسبوك',whatsapp:'واتساب',tiktok:'تيك توك',showroom:'المعرض',phone:'هاتف',other:'أخرى',website:'الموقع',trust:'ترست',count:'جرد'};
const tag=k=>`<span class="tag k-${k}">${KIND[k]||k}</span>`;

let me=null,role=null,myName='',items=[],byId=new Map(),byCode=new Map(),tab='home',lastImport=null;
const isOwner=()=>role==='owner';
const groupOf=it=>it.grp||norm(it.name).split(' ')[0]||'—';
const lowOf=it=>it.qty>0&&it.min_qty!=null&&it.qty<=it.min_qty;
const index=()=>{byId=new Map(items.map(i=>[i.id,i]));byCode=new Map();items.forEach(i=>{if(i.barcode)byCode.set(latin(i.barcode).trim(),i);byCode.set('#'+latin(i.code).trim(),i)});items.forEach(i=>i._n=norm(i.name+' '+(i.name_en||'')+' '+(i.barcode||'')+' '+i.code+' '+(i.loc||'').toLowerCase()))};
const findCode=c=>{c=latin(c).trim();return byCode.get(c)||byCode.get('#'+c)||(/^\d+$/.test(c)?items.find(i=>i.barcode&&latin(i.barcode).replace(/^0+/,'')===c.replace(/^0+/,'')):null)};
const COLS0='id,code,barcode,name,price,qty,min_qty,grp,active,counted_at,trust_qty,trust_at,updated_at';let OPTC=['name_en','loc','loc2'],COLS=COLS0+','+OPTC.join(','),hasLoc=true;
/* items kept on the device so the app opens at once; refreshed from the server right after */
const kv=(()=>{let p;const db=()=>p||(p=new Promise((ok,no)=>{const r=indexedDB.open('sn-stock',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const run=(mode,f)=>db().then(d=>new Promise(ok=>{const t=d.transaction('kv',mode);const q=f(t.objectStore('kv'));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>ok(null)})).catch(()=>null);
  return{get:k=>run('readonly',o=>o.get(k)),set:(k,v)=>run('readwrite',o=>o.put(v,k)),del:k=>run('readwrite',o=>o.delete(k))}})();
let cacheT=null;const saveCache=()=>{clearTimeout(cacheT);cacheT=setTimeout(()=>{if(!me||!role)return;kv.set('items',{u:me.id,role,name:myName,cols:COLS,optc:OPTC,at:Date.now(),lastImport,items:items.map(({_n,...x})=>x)})},800)};
async function fetchAll(table,cols,order){const q=from=>sb.from(table).select(cols).order(order).range(from,from+999);const out=[];
  for(let from=0;;from+=6000){const rs=await Promise.all([0,1,2,3,4,5].map(k=>q(from+k*1000)));const bad=rs.find(r=>r.error);if(bad)throw bad.error;
    rs.forEach(r=>out.push(...r.data));if(rs[5].data.length<1000)break}return out}
async function loadItems(){let out;for(;;){try{out=await fetchAll('inv_items',COLS,'id');break}catch(e){const m=e.message||'';const miss=OPTC.find(c=>m.includes(c));if(!miss)throw e;OPTC=OPTC.filter(c=>c!==miss&&!(miss.startsWith('loc')&&c.startsWith('loc')));COLS=[COLS0,...OPTC].join(',')}}hasLoc=OPTC.includes('loc');saveCache();
  items=out.map(i=>({...i,qty:+i.qty,price:i.price==null?null:+i.price,min_qty:i.min_qty==null?null:+i.min_qty,trust_qty:i.trust_qty==null?null:+i.trust_qty}));index()}
async function refreshItems(ids){ids=[...new Set(ids)].filter(Boolean);for(let k=0;k<ids.length;k+=200){const r=await sb.from('inv_items').select(COLS).in('id',ids.slice(k,k+200));if(r.error)return;r.data.forEach(n=>{const o=byId.get(n.id);const v={...n,qty:+n.qty,price:n.price==null?null:+n.price,min_qty:n.min_qty==null?null:+n.min_qty,trust_qty:n.trust_qty==null?null:+n.trust_qty};if(o){Object.assign(o,v);o._n=norm(o.name+' '+(o.name_en||'')+' '+(o.barcode||'')+' '+o.code)}else items.push(v)});saveCache()}index()}
const search=(q,lim=30)=>{q=norm(q);if(!q)return[];const hit=findCode(q);const ws=q.split(' ');const r=items.filter(i=>ws.every(w=>i._n.includes(w)));if(hit&&!r.includes(hit))r.unshift(hit);return r.slice(0,lim)};

/* ---------- modal / camera ---------- */
const show=h=>{$('#modal').innerHTML=h;$('#modal').classList.add('on');$('#veil').classList.add('on');setTimeout(()=>$('#modal .x')?.focus(),20)};
const close=()=>{$('#modal').classList.remove('on');$('#veil').classList.remove('on')};
$('#veil').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();camStop()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
let camStream=null,camLoop=0;
const camOk=()=>'BarcodeDetector' in window&&navigator.mediaDevices;
async function camScan(cb){if(!camOk())return toast('الكاميرا ما بتدعم مسح الباركود على هالجهاز – استخدم قارئ الباركود');
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('ما في إذن للكاميرا')}
  const v=$('#camv');v.srcObject=camStream;await v.play();$('#cam').classList.add('on');const det=new BarcodeDetector();let last='';
  const tick=async()=>{if(!camStream)return;try{const r=await det.detect(v);if(r[0]&&r[0].rawValue!==last){last=r[0].rawValue;navigator.vibrate&&navigator.vibrate(60);cb(r[0].rawValue);setTimeout(()=>last='',1500)}}catch(e){}camLoop=requestAnimationFrame(tick)};tick()}
function camStop(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}cancelAnimationFrame(camLoop);$('#cam').classList.remove('on')}
$('#camx').onclick=camStop;

/* ---------- picker: type a name or scan a barcode ---------- */
function picker(host,onPick,ph='ابحث بالاسم أو امسح الباركود'){
  host.innerHTML=`<div class="search"><div class="row" style="flex-wrap:nowrap"><input type="search" class="pk" placeholder="${ph}" autocomplete="off" enterkeyhint="go">${camOk()?'<button type="button" class="btn alt pkc" aria-label="مسح بالكاميرا" style="flex:none">📷</button>':''}</div><div class="drop" hidden></div></div>`;
  const inp=host.querySelector('.pk'),dr=host.querySelector('.drop');let res=[],hi=0;
  const draw=()=>{if(!res.length){dr.hidden=true;return}dr.hidden=false;dr.innerHTML=res.map((i,k)=>`<button type="button" data-k="${k}" class="${k===hi?'hi':''}"><span>${esc(i.name)}<br><span class="code">${esc(i.barcode||'')} · #${esc(i.code)}</span></span><span class="n ${i.qty<0?'neg':''}">${fq(i.qty)}</span></button>`).join('')};
  const pick=i=>{onPick(i);inp.value='';res=[];draw();inp.focus()};
  inp.oninput=()=>{res=search(inp.value,25);hi=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){hi=Math.min(hi+1,res.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){hi=Math.max(hi-1,0);draw();e.preventDefault()}
    else if(e.key==='Enter'){e.preventDefault();const exact=findCode(inp.value);if(exact)return pick(exact);if(res[hi])pick(res[hi]);else if(inp.value.trim())toast('ما في صنف بهالرمز')}else if(e.key==='Escape'){res=[];draw()}};
  dr.onclick=e=>{const b=e.target.closest('[data-k]');if(b)pick(res[+b.dataset.k])};
  host.querySelector('.pkc')&&(host.querySelector('.pkc').onclick=()=>camScan(c=>{const i=findCode(c);if(i){onPick(i);toast('✓ '+i.name,1200)}else toast('ما في صنف بالباركود '+c)}));
  document.addEventListener('click',e=>{if(!host.contains(e.target)){res=[];draw()}});
  return inp}

/* ---------- login ---------- */

/* ---------- publish Trust items to the shop ---------- */
const inShop=P=>{const ids=new Set(P.map(p=>p.id));const skus=new Set(P.flatMap(p=>(p.data.vars||[]).map(v=>latin(v.sku||'').trim()).filter(Boolean)));return i=>ids.has('t'+i.code)||skus.has(latin(i.barcode||'').trim())||skus.has(latin(i.code).trim())};
function productFor(i,sort){const C=SNCatalog.classify(i.name);const unit=SNCatalog.unitOf(i.name);const price=+i.price||0;
  return{id:'t'+i.code,sort,data:{id:'t'+i.code,name:i.name.replace(/\s+/g,' ').trim(),name_en:(i.name_en||'').trim(),cat:C.cat,cat_en:SNCatalog.CAT_EN[C.cat]||'',sub:C.sub,sub_en:SNCatalog.SUB_EN[C.sub]||'',tags:[],kind:C.kind,unit,desc:'',desc_en:'',ask:!(price>0),visible:!C.hide,src:'trust',
    vars:[{label:unit,price,stock:Math.max(0,Math.floor(i.qty)),sku:latin(i.barcode||i.code).trim()}]}}}
function catsFor(list,P,oldCats){const cover=c=>{const o=(oldCats||[]).find(x=>x.name===c);if(o&&o.img)return o.img;const p=P.find(p=>p.data.cat===c&&(p.data.img||(p.data.vars||[]).some(v=>v.img)));return p?(p.data.img||p.data.vars.find(v=>v.img).img):''};
  return SNCatalog.ORDER.filter(c=>list.some(x=>x.data.cat===c)).map(c=>({name:c,name_en:SNCatalog.CAT_EN[c]||'',img:cover(c),subs:[...new Set(list.filter(x=>x.data.cat===c).map(x=>x.data.sub))].map(sn=>({name:sn,name_en:SNCatalog.SUB_EN[sn]||''}))}))}
function publishCard(P){const has=inShop(P);const todo=items.filter(i=>!has(i));const fromTrust=P.filter(p=>/^t/.test(p.id)).length;const other=P.length-fromTrust;
  const cl=todo.map(i=>SNCatalog.classify(i.name));const hid=cl.filter(c=>c.hide).length;
  return `<div class="card" style="border:2px solid var(--gold)"><h2 style="margin-top:0">أصناف ترست على المتجر</h2>
  <div class="kpis"><div class="kpi"><b>${fromTrust.toLocaleString('en')}</b><span>صنف ترست على المتجر</span></div><div class="kpi ${todo.length?'warn':''}"><b>${todo.length.toLocaleString('en')}</b><span>صنف مش على المتجر بعد</span></div>${other?`<div class="kpi"><b>${other}</b><span>منتج قديم (مش من ترست)</span></div>`:''}</div>
  ${fromTrust===0?`<p class="note" style="margin-top:0">رح يتحول كل صنف بترست لمنتج بالمتجر: بالاسم والسعر من ترست، والكمية من نظام المخزون (الأصناف اللي كميتها صفر بتظهر «نفدت الكمية»)، وبينصنّف تلقائياً حسب اسمه على أقسام المتجر. <b>${hid}</b> صنف رح ينضاف <b>مخفي</b>: أجور الطباعة والكلاشيهات، والمطبوعات الخاصة بزبائن معينين، والأسماء الناقصة مثل «علبة». بتقدر تظهرهم من لوحة المتجر.</p>
   ${other?`<div class="warnbox">المنتجات القديمة (${other}) رح تنشال من المتجر وتنحفظ نسخة منها بقاعدة البيانات (products_backup). صور الأقسام القديمة بتضل.</div>`:''}
   <button class="btn gold" id="pub" style="width:100%">نشر ${items.length.toLocaleString('en')} صنف على المتجر${other?' واستبدال المنتجات القديمة':''}</button>`
  :todo.length?`<p class="note" style="margin-top:0">أصناف جديدة من ترست مش على المتجر. بتنضاف لحالها بعد كل استيراد يومي، أو أضفها هلأ.</p><button class="btn gold" id="pubnew">إضافة ${todo.length} صنف للمتجر</button>`:'<p class="okbox" style="margin:0">كل أصناف ترست موجودة على المتجر ✓</p>'}</div>`}
async function publishAll(P,replace,btn,quiet){const has=inShop(P);let todo=items.filter(i=>!has(i));if(replace&&btn&&btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent='متأكد؟ اضغط مرة ثانية للنشر';btn.classList.add('bad');return}
  if(!todo.length)return;const all=[...todo].sort((a,b)=>{const A=SNCatalog.classify(a.name),Bc=SNCatalog.classify(b.name);return SNCatalog.ORDER.indexOf(A.cat)-SNCatalog.ORDER.indexOf(Bc.cat)||A.sub.localeCompare(Bc.sub,'ar')||a.name.localeCompare(b.name,'ar')});
  const base=P.length?Math.max(...P.map(p=>+p.sort||0))+1:0;const rows=all.map((i,k)=>productFor(i,(replace?0:base)+k));
  const st=await sb.from('settings').select('data').eq('id',1).maybeSingle();const oldCats=st.data&&st.data.data.categories;
  const keep=replace?[]:P.filter(p=>/^t/.test(p.id));const cats=catsFor([...keep,...rows],P,oldCats);
  let done=0;for(let k=0;k<rows.length;k+=500){if(btn)btn.textContent='جاري النشر… '+Math.round(100*k/rows.length)+'%';
    const r=await sb.rpc('inv_publish',{rows:rows.slice(k,k+500),replace:replace&&k===0,cats:k+500>=rows.length?cats:null});if(r.error){if(btn){btn.disabled=false;btn.textContent='حاول مرة ثانية'}toast(emsg(r.error),4000);return false}done+=r.data.added}
  if(!quiet){toast('تم نشر '+done.toLocaleString('en')+' صنف على المتجر ✓',3500);if(tab==='link')PANES.link()}return done}

function code128(text,h=40){const s=String(text).replace(/[^\x20-\x7e]/g,'');const vals=[104,...[...s].map(c=>c.charCodeAt(0)-32)];

async function fetchWhere(table,cols,col,val,order){const out=[];for(let f=0;;f+=6000){const rs=await Promise.all([0,1,2,3,4,5].map(k=>sb.from(table).select(cols).eq(col,val).order(order).range(f+k*1000,f+k*1000+999)));
  const bad=rs.find(r=>r.error);if(bad)throw bad.error;rs.forEach(r=>out.push(...r.data));if(rs[5].data.length<1000)break}return out}
async function loadFC(){const s=await sb.from('inv_count_sessions').select('*').eq('status','open').maybeSingle();if(s.error)throw s.error;
  if(!s.data){FC=null;return}const sid=s.data.id;
  const [z,fl,ln]=await Promise.all([sb.from('inv_count_zones').select('*').eq('session_id',sid).eq('area','CAT'),sb.from('inv_count_flags').select('item_id,reason,round').eq('session_id',sid),
    fetchWhere('inv_count_lines','id,item_id,loc,qty,unknown,round,by_name,by_user,created_at,voided','session_id',sid,'id')]);
  if(z.error)throw z.error;
  const lines=ln.filter(l=>!l.voided);const byItem=new Map();const maxR=new Map();
  lines.forEach(l=>{if(l.item_id==null)return;(byItem.get(l.item_id)||byItem.set(l.item_id,[]).get(l.item_id)).push(l);if(l.round>(maxR.get(l.item_id)||0))maxR.set(l.item_id,l.round)});
  const tot=new Map();lines.forEach(l=>{if(l.item_id!=null&&l.round===maxR.get(l.item_id))tot.set(l.item_id,(tot.get(l.item_id)||0)+ +l.qty)});
  FC={s:s.data,zones:z.data,cats:z.data.map(x=>x.aisle),flags:new Map((fl.data||[]).map(x=>[x.item_id,x])),lines,byItem,maxR,tot}}
// what an item stands at now, and whether it still waits for its recount

      <p class="note" style="margin-bottom:0">اكتب اللي قدامك بهالمكان بس، بوحدة ترست. للكراتين: <b class="code">12*20+7</b>. إذا الصنف انعدّ بمكان ثاني، العدّ الجديد بينضاف عليه.</p></div>
    ${D.u.length?`<div class="card"><h3 style="margin-top:0">أصناف غير معروفة</h3>${D.u.map((u,n)=>`<div class="line fcl"><div>${esc(u.t)}</div><input type="text" inputmode="decimal" dir="ltr" data-uq="${n}" value="${esc(u.q)}" placeholder="الكمية" style="text-align:center"><span class="n"></span><button class="x" data-ux="${n}" aria-label="حذف">×</button></div>`).join('')}</div>`:''}
    <div class="card" id="fl">${L.length?L.map(i=>{const s=subOf(i);const head=s!==lastSub?`<h3 style="margin:${lastSub==null?0:14}px 0 6px">${esc(s)}</h3>`:'';lastSub=s;const cur=fcCur(i.id);const v=D.q[i.id]??'';const e=evalQ(v);const w=fcWaiting(i.id);
      return head+`<div class="line fcl" ${i.id===fc.focus?'style="background:#fff8e6"':''}><div>${esc(i.name)}<div class="code">${esc(i.barcode||'#'+i.code)}</div>${cur.length&&!w?`<button class="tag" data-hl="${i.id}" style="border:0;color:var(--ok);cursor:pointer">معدود: ${sumLines(cur)}</button>`:''}${w?'<span class="tag" style="color:var(--bad)">إعادة عدّ</span>':''}</div>
      <input type="text" inputmode="decimal" dir="ltr" data-iq="${i.id}" value="${esc(v)}" placeholder="+" aria-label="الكمية" style="text-align:center"><span class="n">${e==null?'':isNaN(e)?'<span class="neg">؟</span>':'= '+fq(e)}</span><span></span></div>`}).join('')+(more?'<p class="note">أول 250 صنف – استعمل الفلترة أو المسح للباقي.</p>':''):'<div class="empty">ما في أصناف هون.</div>'}</div>
    <div class="bar"><button class="btn alt" id="fu">صنف غير معروف</button><button class="btn gold" id="fsv" ${nDraft?'':'disabled'}>إضافة العدّ (${nDraft})${fcPlace?' – '+esc(fcPlace):''}</button></div>`;
    $('#fb').onclick=()=>fcGo('board');
    bindPlace(draw);
    const zset=async(status,team)=>{const r=await sb.rpc('inv_count_zone',{session:FC.s.id,area:'CAT',aisle:cat,status:status??null,team:team??null});if(r.error)return toast(emsg(r.error),4000);await loadFC();fcCat(host)};
    $('#fz1')&&($('#fz1').onclick=()=>zset('counting'));$('#fz2')&&($('#fz2').onclick=()=>zset('done'));$('#fzs')&&($('#fzs').onclick=()=>zset($('#fs').value,$('#ft').value||''));
    const inp=picker($('#fpk'),i=>{if(!all.some(x=>x.id===i.id)){const c=cls(i).cat;if(!flagView&&FC.cats.includes(c)&&c!==cat){fcGo('cat',c,i.id);return}all.unshift(i)}fc.focus=i.id;fc.q='';draw();setTimeout(()=>{const x=$(`[data-iq="${i.id}"]`);x&&(x.focus(),x.select())},0)},'امسح الصنف أو ابحث بالاسم');
    $('#fq').onchange=e=>{fc.q=e.target.value;draw()};$('#ftd').onchange=e=>{fc.todo=e.target.checked;draw()};
    $$('[data-iq]').forEach(x=>{x.oninput=()=>{const id=+x.dataset.iq;if(x.value.trim()==='')delete D.q[id];else D.q[id]=x.value;saveDraft();const e=evalQ(x.value);x.nextElementSibling.innerHTML=e==null?'':isNaN(e)?'<span class="neg">؟</span>':'= '+fq(e);
        const n=Object.values(D.q).length+D.u.length;$('#fsv').disabled=!n;$('#fsv').textContent=`إضافة العدّ (${n})${fcPlace?' – '+fcPlace:''}`};
      x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#fpk .pk').focus()}}});
    $$('[data-uq]').forEach(x=>x.oninput=()=>{D.u[+x.dataset.uq].q=x.value;saveDraft()});
    $$('[data-ux]').forEach(b=>b.onclick=()=>{D.u.splice(+b.dataset.ux,1);saveDraft();draw()});
    $$('[data-hl]').forEach(b=>b.onclick=()=>fcLines(+b.dataset.hl,()=>{fcCat(host)}));
    $('#fu').onclick=()=>{const t=prompt('وصف الصنف (الاسم، اللون، الحجم، أي رقم عليه):');if(!t||!t.trim())return;D.u.unshift({t:t.trim().slice(0,200),q:''});saveDraft();draw();setTimeout(()=>$('[data-uq="0"]')?.focus(),0)};
    $('#fsv').onclick=async e=>{
      if(!fcPlace)return toast('اختار وين عم تعدّ أولاً (المعرض / المستودع / السدة…)',3500);
      const bad=Object.entries(D.q).find(([,v])=>{const x=evalQ(v);return x==null||isNaN(x)})||D.u.find(u=>{const x=evalQ(u.q);return x==null||isNaN(x)});
      if(bad){toast('في كمية غلط أو فاضية',3000);return}
      const lines=[...Object.entries(D.q).map(([id,v])=>({item:+id,qty:evalQ(v)})),...D.u.map(u=>({unknown:u.t,qty:evalQ(u.q)}))];
      e.target.disabled=true;let saved=0;
      for(let k=0;k<lines.length;k+=400){const r=await sb.rpc('inv_count_add',{session:FC.s.id,place:fcPlace,lines:lines.slice(k,k+400)});if(r.error){e.target.disabled=false;return toast(emsg(r.error)+' – العدّ محفوظ على الجهاز، جرّب مرة ثانية',5000)}saved+=r.data.saved}
      fcDraft[key]={q:{},u:[]};saveDraft();toast(`تمت إضافة ${saved} سطر – ${fcPlace} ✓`);
      if(zz&&zz.status==='todo')await sb.rpc('inv_count_zone',{session:FC.s.id,area:'CAT',aisle:cat,status:'counting',team:null});
      fc.focus=null;await loadFC();fcCat(host)};
    if(fc.focus)setTimeout(()=>{const x=$(`[data-iq="${fc.focus}"]`);x&&(x.focus(),x.select())},0)};
  draw()}

// every line counted for an item, by place and person; a wrong one can be removed (your own, or any for the owner)
function fcLines(id,after){
  const i=byId.get(id);const L=(FC.byItem.get(id)||[]).slice().sort((a,b)=>b.round-a.round||a.id-b.id);const mr=FC.maxR.get(id);
  show(`<div class="mh"><h2>${esc(i?i.name:'')}</h2><button class="x" data-close aria-label="إغلاق">×</button></div><div class="mb">
    <p class="note" style="margin-top:0">كل عدّة سطر لحاله، والمجموع هو اللي بيعتمد. ${L.some(l=>l.round<mr)?'الأسطر الرمادية من عدّ قديم انعاد عدّه.':''}</p>
    <table><tbody>${L.map(l=>`<tr style="${l.round<mr?'opacity:.45':''}"><td>${esc(l.loc||'—')}</td><td class="n"><b>${fq(l.qty)}</b></td><td>${esc(l.by_name||'')}<div class="note">${fday(l.created_at)}${l.round>1?' · إعادة عدّ':''}</div></td><td>${isOwner()||l.by_user===me.id?`<button class="btn sm alt" data-lv="${l.id}">حذف</button>`:''}</td></tr>`).join('')}</tbody></table>
    <p><b>المجموع: ${fq(FC.tot.get(id)||0)}</b></p></div>`);
  $$('#modal [data-lv]').forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='متأكد؟';b.classList.add('bad');return}
    const r=await sb.rpc('inv_count_void',{line:+b.dataset.lv});if(r.error)return toast(emsg(r.error),4000);toast('انحذف السطر');await loadFC();close();after&&after()})}

function fcReview(host){
  const lines=FC.lines;const tot=FC.tot;const full=FC.s.kind==='full';const inSess=i=>full||FC.cats.includes(cls(i).cat);
  const locsOf=id=>sumLines(fcCur(id));
  const rows=items.filter(i=>tot.has(i.id)||(inSess(i)&&i.active&&i.qty!==0)).map(i=>{const c=tot.has(i.id)?tot.get(i.id):null;const after=c==null?0:c;const d=after-i.qty;
    return{i,c,d,v:d*(i.price||0),r:FC.maxR.get(i.id)||0,cat:cls(i).cat,where:c==null?'':locsOf(i.id)}});
  const big=x=>x.c!=null&&(Math.abs(x.d)>=5||Math.abs(x.v)>=5||(x.c>0&&x.i.qty<=0));
  const miss=x=>x.c==null;
  const unknown=lines.filter(l=>l.item_id==null);
  const F={diff:['كل الفروقات',x=>x.d!==0],big:['مقترح لإعادة العدّ',x=>big(x)&&!FC.flags.has(x.i.id)],missing:['ما انلاقى',miss],flagged:['قيد إعادة العدّ',x=>FC.flags.has(x.i.id)],all:['الكل',()=>true]};
  const f=F[fcRv.f]?fcRv.f:'diff';const qn=norm(fcRv.q||'');
  const view=rows.filter(F[f][1]).filter(x=>(!fcRv.cat||x.cat===fcRv.cat)&&(!qn||x.i._n.includes(qn))).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const cats=[...new Set(rows.map(x=>x.cat))].sort((a,b)=>catOrder(a)-catOrder(b));
  const zeroIds=rows.filter(miss).map(x=>x.i.id);const sum=rows.reduce((s,x)=>s+x.v,0);
  host.innerHTML=`<div class="row sp" style="margin-bottom:10px"><button class="btn sm alt" id="fb">← لوحة الجرد</button><b>${esc(FC.s.name)}</b></div>
  <div class="kpis"><div class="kpi"><b>${tot.size}</b><span>صنف انعدّ</span></div>
  <div class="kpi"><b>${rows.filter(x=>x.c!=null&&x.d!==0).length}</b><span>صنف فيه فرق</span></div><div class="kpi ${zeroIds.length?'warn':''}"><b>${zeroIds.length}</b><span>رصيده بالنظام وما انلاقى</span></div>
  <div class="kpi ${sum<0?'warn':''}"><b style="font-size:19px">${fm(sum)}</b><span>قيمة الفرق الكلية</span></div>${unknown.length?`<div class="kpi warn"><b>${unknown.length}</b><span>سطر صنف غير معروف</span></div>`:''}</div>
  <div class="seg">${Object.entries(F).map(([k,v])=>`<button class="${k===f?'on':''}" data-rf="${k}">${v[0]} (${rows.filter(v[1]).length})</button>`).join('')}</div>
  <div class="row" style="margin-bottom:10px"><select id="rct" style="flex:1 1 180px"><option value="">كل الأقسام</option>${cats.map(c=>`<option ${c===fcRv.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><input id="rq" type="search" placeholder="بحث بالاسم أو الباركود" value="${esc(fcRv.q||'')}" style="flex:1 1 200px"></div>
  <div class="row" style="margin-bottom:10px"><button class="btn sm alt" id="rsa">تحديد الكل بهالقائمة</button><button class="btn sm" id="rfl">إعادة عدّ المحدد</button><button class="btn sm alt" id="rcl">إلغاء إعادة العدّ للمحدد</button><button class="btn sm alt" id="rxp">تصدير Excel</button></div>
  ${view.length?`<table class="stack"><thead><tr><th></th><th>الصنف</th><th>القسم</th><th>انعدّ وين</th><th class="n">بالنظام</th><th class="n">المعدود</th><th class="n">الفرق</th><th class="n">القيمة</th></tr></thead><tbody>${view.slice(0,400).map(x=>`<tr><td><input type="checkbox" data-rs="${x.i.id}" style="width:20px;height:20px" ${fcRv.sel.has(x.i.id)?'checked':''}></td><td>${esc(x.i.name)}<div class="code">${esc(x.i.barcode||'#'+x.i.code)}</div>${FC.flags.has(x.i.id)?`<span class="tag" style="color:var(--bad)">${fcWaiting(x.i.id)?'إعادة عدّ – لسا':'انعاد عدّه'}</span>`:''}</td><td>${esc(x.cat)}</td><td>${x.c==null?'—':`<button class="tag" data-hl="${x.i.id}" style="border:0;cursor:pointer">${x.where}</button>`}</td><td class="n">${fq(x.i.qty)}</td><td class="n">${x.c==null?'—':fq(x.c)}</td><td class="n ${x.d<0?'neg':''}">${x.d>0?'+':''}${fq(x.d)}</td><td class="n ${x.v<0?'neg':''}">${fm(x.v)}</td></tr>`).join('')}</tbody></table>${view.length>400?`<p class="note">أول 400 من ${view.length} – الكل بملف Excel.</p>`:''}`:'<div class="empty">ما في شي هون.</div>'}
  ${unknown.length?`<h3>أصناف غير معروفة</h3><table class="stack"><tbody>${unknown.map(l=>`<tr><td>${esc(l.unknown)}</td><td>${esc(l.loc||'')}</td><td class="n">${fq(l.qty)}</td><td>${esc(l.by_name||'')}</td></tr>`).join('')}</tbody></table><p class="note">هدول ما بيدخلوا الرصيد. لما تعرفهم سجلهم من «بيع / استلام» أو كجرد سريع.</p>`:''}
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">الاعتماد والإغلاق</h3><p class="note">كل صنف انعدّ بيصير رصيده = مجموع اللي انعدّ من كل الأماكن (إعادة العدّ بتحل محل العدّ الأول)، وكل فرق بينسجل بسجل الحركات باسمك.${full?'':' الأقسام اللي مش ضمن الجرد ما بتتغير.'}</p>
  <label class="row" style="color:var(--ink)"><input type="checkbox" id="rz" checked style="width:20px;height:20px"> الأصناف${full?'':' من أقسام الجرد'} اللي رصيدها مش صفر وما انعدّت بتصير صفر (${zeroIds.length} صنف)</label>
  <div class="row"><button class="btn bad" id="rclose">اعتماد وإغلاق الجرد</button><button class="btn alt" id="rcancel">إلغاء الجرد بدون اعتماد</button></div></div>`;
  $('#fb').onclick=()=>fcGo('board');
  $$('[data-rf]').forEach(b=>b.onclick=()=>{fcRv.f=b.dataset.rf;fcRv.sel.clear();fcReview(host)});
  $('#rct').onchange=e=>{fcRv.cat=e.target.value;fcRv.sel.clear();fcReview(host)};
  $('#rq').onchange=e=>{fcRv.q=e.target.value;fcReview(host);setTimeout(()=>$('#rq')?.focus(),0)};
  $$('[data-rs]').forEach(x=>x.onchange=()=>{x.checked?fcRv.sel.add(+x.dataset.rs):fcRv.sel.delete(+x.dataset.rs)});
  $$('[data-hl]').forEach(b=>b.onclick=()=>fcLines(+b.dataset.hl,()=>fcReview(host)));
  $('#rsa').onclick=()=>{view.forEach(x=>fcRv.sel.add(x.i.id));fcReview(host)};
  const flag=async clear=>{if(!fcRv.sel.size)return toast('حدد أصناف أولاً');const r=await sb.rpc('inv_count_flag',{session:FC.s.id,items:[...fcRv.sel],reason:clear?null:'فرق كبير',clear});if(r.error)return toast(emsg(r.error),4000);
    toast(clear?'تم الإلغاء':`${r.data.flagged} صنف بقائمة إعادة العدّ`,3500);fcRv.sel.clear();await loadFC();fcReview(host)};
  $('#rfl').onclick=()=>flag(false);$('#rcl').onclick=()=>flag(true);
  $('#rxp').onclick=async()=>{await loadXLSX();const ws=XLSX.utils.json_to_sheet(rows.slice().sort((a,b)=>catOrder(a.cat)-catOrder(b.cat)||Math.abs(b.v)-Math.abs(a.v)).map(x=>({'رمز المادة':x.i.code,'الباركود':x.i.barcode||'','اسم المادة':x.i.name,'القسم':x.cat,'العائلة':cls(x.i).sub||'','انعدّ وين':x.where.replace(/ · /g,'، '),'بالنظام':x.i.qty,'المعدود':x.c==null?'':x.c,'الفرق':x.d,'سعر البيع':x.i.price??'','قيمة الفرق':+x.v.toFixed(3),'إعادة عدّ':x.r>1?'نعم':''})));
    const ws2=XLSX.utils.json_to_sheet(lines.map(l=>{const i=l.item_id!=null?byId.get(l.item_id):null;return{'الصنف':i?i.name:'غير معروف: '+l.unknown,'رمز المادة':i?i.code:'','المكان':l.loc||'','الكمية':+l.qty,'العدّ':l.round>1?'إعادة':'أول','عدّه':l.by_name||'','الوقت':new Date(l.created_at).toLocaleString('en-GB'),'معتمد':l.item_id==null||l.round===FC.maxR.get(l.item_id)?'نعم':'لا (انعاد عدّه)'}}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الجرد');XLSX.utils.book_append_sheet(wb,ws2,'كل الأسطر');XLSX.writeFile(wb,'sn-count-'+new Date().toISOString().slice(0,10)+'.xlsx')};
  $('#rclose').onclick=async e=>{const b=e.target;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='متأكد؟ هالخطوة نهائية – اضغط مرة ثانية';return}b.disabled=true;b.textContent='جاري الاعتماد…';
    const zero=$('#rz').checked;const r=await sb.rpc('inv_count_close',{session:FC.s.id,missing_zero:zero,zero_items:full?null:items.filter(i=>i.active&&inSess(i)&&!tot.has(i.id)).map(i=>i.id)});b.disabled=false;if(r.error){b.textContent='حاول مرة ثانية';return toast(emsg(r.error),5000)}
    Object.keys(fcDraft).filter(k=>k.startsWith(FC.s.id+'|')).forEach(k=>delete fcDraft[k]);saveDraft();await loadItems();
    show(`<div class="mh"><h2>تم اعتماد الجرد ✓</h2><button class="x" data-close aria-label="إغلاق">×</button></div><div class="mb"><div class="kpis"><div class="kpi"><b>${r.data.counted}</b><span>صنف انعدّ</span></div><div class="kpi"><b>${r.data.changed}</b><span>رصيده تغيّر</span></div><div class="kpi"><b>${r.data.zeroed}</b><span>صار صفر (ما انلاقى)</span></div><div class="kpi"><b style="font-size:18px">${fm(r.data.value_diff)}</b><span>قيمة الفرق</span></div></div><p class="note">الأرصدة الجديدة صارت بالنظام من اليوم، والموقع أخذها.</p></div>`);
    fcGo('board')};
  $('#rcancel').onclick=async e=>{const b=e.target;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='متأكد؟ كل العدّ بيتلغى';return}const r=await sb.rpc('inv_count_cancel',{session:FC.s.id});if(r.error)return toast(emsg(r.error));toast('تم إلغاء الجرد');fcGo('board')}}
const fcRv={f:'diff',q:'',cat:'',sel:new Set()};

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
start();
}
</script>
</body>
</html>
