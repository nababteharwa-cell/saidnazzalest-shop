<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/">
<meta name="robots" content="noindex,nofollow">
<title>سعيد نزال التجارية | Said Nazzal Trading</title>
<meta name="description" content="مستلزمات المطاعم والكافيهات والحلويات ومواد التغليف – عمّان، الجبيهة. اطلب أونلاين والدفع عند الاستلام.">
<link rel="icon" href="icons/shop-192.png">
<link rel="manifest" id="mf" href="shop.webmanifest">
<meta name="theme-color" content="#1B2D5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" id="atitle" content="سعيد نزال">
<link rel="apple-touch-icon" id="aicon" href="icons/apple-shop.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a well-lit wholesale showroom — calm, quick, trustworthy; the products do the talking.
   IDEA: the shop sign and the gold ring of the SN logo; everything else is a clean white shelf.
   PICTURE: full-bleed storefront photo in the banner under a navy wash, gold ring badge "since 1991".
   COLOUR and TYPE: logo navy #1B2D5B dominant, logo gold #C9973B as the single accent, cool grey ground; IBM Plex Sans Arabic only.
   LAYOUT: white sticky header, banner, underline category tabs, square white product tiles, navy footer. */
:root{color-scheme:light;--bg:#F3F4F7;--card:#fff;--ink:#141A2E;--mute:#646B7E;--line:#E3E6EE;--navy:#1B2D5B;--navyBg:#1B2D5B;--gold:#C9973B;--goldInk:#7A5517;--kraftSoft:#F7F8FA;--ok:#1E7A4C;--bad:#B3261E;--r:14px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* header */
header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:10px max(4vw,14px);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none;color:var(--navy);white-space:nowrap}
.mark{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.mark img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:0 16px;border:1px solid transparent}
.search:focus-within{border-color:var(--navy);background:#fff}
.search svg{color:var(--mute)}
.search input{width:100%;border:0;background:transparent;padding:11px 0;font-size:16px;outline:0}
.hbtn{background:transparent;border:0;color:var(--ink);border-radius:999px;padding:9px 14px;min-height:44px;display:flex;gap:8px;align-items:center;font-weight:500}
.hbtn:hover{background:var(--bg)}
#cartBtn{background:var(--navy);color:#fff}
#cartBtn:hover{background:#24397A}
.tag{display:inline-block;background:#EEF0F5;color:var(--ink);border-radius:99px;padding:1px 9px;font-size:12.5px;margin:1px}
.linkish{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;font:inherit;cursor:pointer;text-align:start}
.badge{background:var(--gold);color:#fff;border-radius:99px;min-width:22px;padding:0 6px;font-size:13px;font-weight:700;text-align:center}
.wrap{max-width:1280px;margin:auto;padding:22px max(4vw,14px) 64px}
/* banner */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:clamp(300px,36vw,440px);display:flex;align-items:flex-end;color:#fff;background:var(--navy) center/cover no-repeat;margin-bottom:26px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to var(--fade,left),#1B2D5Bf5 0%,#1B2D5Bd9 38%,#1B2D5B33 75%,#1B2D5B10 100%)}
[dir=ltr] .hero::before{--fade:right}
.hero .txt{position:relative;padding:clamp(24px,4vw,52px);max-width:640px}
.hero h1{font-size:clamp(28px,3.6vw,46px);line-height:1.12;margin:0 0 12px;font-weight:700;text-wrap:balance}
.hero p{margin:0 0 22px;color:#DCE2F2;font-size:17px;max-width:52ch}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:13px 26px;font-weight:600;font-size:16px;min-height:48px}
.cta:hover{background:#B5852D}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px}
.pill{display:flex;align-items:center;gap:8px;font-size:14px;color:#E8ECF7}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.ring{position:absolute;top:clamp(16px,2.4vw,28px);inset-inline-end:clamp(16px,2.4vw,28px);width:104px;height:104px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;text-align:center;font-size:13px;line-height:1.25;color:#fff;background:#1B2D5B99;backdrop-filter:blur(4px)}
.ring b{display:block;font-size:24px;color:var(--gold)}
.art{position:absolute;bottom:clamp(16px,2.4vw,28px);inset-inline-end:clamp(16px,2.4vw,28px);display:flex;gap:10px}
.art img{width:clamp(84px,9vw,128px);aspect-ratio:1;object-fit:cover;border-radius:14px;border:3px solid #fff;box-shadow:0 8px 24px #0004}
/* categories */
.shophead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 4px}
.shophead h2{margin:0;font-size:24px}
.count{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;padding:12px 14px;min-height:46px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--navy);border-color:var(--gold);font-weight:700}
#shop{scroll-margin-top:80px}
.thumb{position:relative}.offb{position:absolute;top:8px;inset-inline-start:8px;background:var(--bad,#b42318);color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:2px 9px}
.was{color:var(--mute);font-weight:400;font-size:.85em;margin-inline-end:4px}.offt{color:var(--bad,#b42318);font-weight:700}
.ostrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 18px;margin:0 0 18px;text-decoration:none}
.ostrip b{font-size:17px}.ostrip .go{margin-inline-start:auto;background:var(--gold);color:#fff;border-radius:99px;padding:6px 14px;font-weight:700}
.showroom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;background:#fff;border-radius:var(--r);padding:20px;margin:28px 0 8px}
.showroom h2{margin:0 0 6px}.sraddr{margin:0 0 6px;font-size:16px}.srstate{margin:0 0 10px;font-weight:700;color:var(--mute)}.srstate.on{color:var(--ok,#1a7f37)}
.hours{border-collapse:collapse;margin:0 0 14px;min-width:260px}.hours th,.hours td{text-align:start;padding:4px 0;font-weight:400}.hours th{padding-inline-end:24px;color:var(--mute)}.hours tr.today th,.hours tr.today td{font-weight:700;color:var(--ink)}
.srbtn{display:flex;flex-wrap:wrap;gap:8px}.srbtn .wa{margin:0}.srmap iframe{width:100%;height:100%;min-height:320px;border:0;border-radius:12px;background:var(--bg)}
.quote{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.quote .note{margin:4px 0 10px}
@media(max-width:800px){.showroom{grid-template-columns:minmax(0,1fr)}.srmap iframe{min-height:260px}}
.tg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-bottom:6px}@media(max-width:600px){.tg{grid-template-columns:minmax(0,1fr)}}
.segs{margin:6px 0 18px}.segrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:10px}
.seg{background:#fff;border-radius:var(--r);padding:10px 10px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 0 var(--line);color:var(--ink);text-decoration:none;border-top:4px solid var(--navy)}
.seg:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}.seg:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.seg .si{display:block;aspect-ratio:4/3;overflow:hidden;border-radius:10px;margin-bottom:8px;background:var(--bg)}
.seg .si img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;transition:transform .4s}.seg:hover .si img{transform:scale(1.04)}@media(prefers-reduced-motion:reduce){.seg .si img{transition:none}}
.seg b{font-size:16px;line-height:1.35}.seg .sd{font-size:13px;color:var(--mute);line-height:1.5}.seg .count{font-size:13px;color:var(--navy);font-weight:600;margin-top:auto;padding-top:4px}
.segd{color:var(--mute);margin:-2px 0 12px;max-width:70ch}
@media(max-width:1100px){.segrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.segrow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px;scrollbar-width:none}.seg{flex:0 0 66%;scroll-snap-align:start}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:10px 0 26px}
.tile{background:#fff;border:0;border-radius:var(--r);padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 0 var(--line)}
.tile:hover{box-shadow:0 10px 30px #1B2D5B1f}
.ti{aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--bg);margin-bottom:8px;display:block}
.ti img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{font-size:15px;line-height:1.35}
.occ,.subs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.occ>span{color:var(--mute);font-size:14px;margin-inline-end:4px}
.ochip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;min-height:40px;font-size:14px}
.optrow{gap:6px;margin-bottom:4px}
.ochip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.subs{margin-top:-8px}
/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:var(--card);border:0;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0;box-shadow:0 1px 0 var(--line);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 30px #1B2D5B1f;transform:translateY(-2px)}
.thumb{aspect-ratio:1;background:#fff;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--bg)}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb svg{width:58%;height:auto}
.card .b{padding:12px 14px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.card h3{font-size:15px;margin:0;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat{font-size:12.5px;color:var(--mute)}
.price{font-weight:700;color:var(--navy);white-space:nowrap;margin-top:auto;padding-top:8px;font-size:16px}
.ask{color:var(--goldInk);font-weight:600}
.oos{color:var(--bad);font-size:13px}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
a.card,a.tile,a.chip,a.ochip{text-decoration:none;color:inherit}a.chip.on{color:var(--navy)}a.ochip.on{color:#fff}a.ochip{display:inline-flex;align-items:center}a.chip{display:inline-flex;align-items:center}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--mute);margin:4px 0 6px}.crumbs a{color:var(--mute);min-height:36px;display:inline-flex;align-items:center}.crumbs a:hover{color:var(--navy)}.crumbs span[aria-hidden]{opacity:.5}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 18px;margin:0 0 14px}.pagehead h1{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.2}.pagehead .count{color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 16px}.tools select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}.tools label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0}.tools input[type=checkbox]{width:22px;height:36px;margin:0}
.feat{margin:6px 0 30px}.feat .shophead{flex-wrap:wrap}.feat .shophead a,.shophead a.count{font-weight:600;color:var(--navy);white-space:nowrap;flex:none;min-height:40px;display:inline-flex;align-items:center}.feat .grid{grid-template-columns:repeat(6,minmax(0,1fr))}@media(max-width:1100px){.feat .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lead{color:var(--mute);margin:-6px 0 18px;max-width:70ch}
.pview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;background:#fff;border-radius:var(--r);padding:18px;margin-top:8px}.pview h1{margin:0 0 8px;font-size:clamp(22px,2.6vw,30px)}.pview .thumb{aspect-ratio:4/3;background:var(--kraftSoft);border-radius:12px;overflow:hidden}.pview img{width:100%;height:100%;object-fit:contain}@media(max-width:700px){.pview{grid-template-columns:1fr}}
/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;min-height:44px;font-weight:600;background:var(--navy);color:#fff}
.btn:hover{background:#24397A}
.btn.alt{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.alt:hover{background:var(--bg)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wa{display:inline-flex;align-items:center;gap:8px;background:#1E7A4C;color:#fff;text-decoration:none;border-radius:999px;padding:11px 20px;font-weight:600}
/* overlays */
.veil{position:fixed;inset:0;background:#141A2E66;backdrop-filter:blur(2px);z-index:40;display:none}
.veil.on{display:block}
.drawer{position:fixed;inset-block:0;right:0;width:min(460px,100%);background:#fff;z-index:50;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px #0002}
.drawer.on{transform:none}
.modal{position:fixed;z-index:50;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(600px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;display:none;box-shadow:0 30px 80px #0003}
.modal.on{display:block}
.modal .thumb{border-radius:0}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:19px}
.x{background:var(--bg);border:0;font-size:22px;width:40px;height:40px;border-radius:50%}
.db{padding:18px 20px;overflow:auto;flex:1}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:40px;height:40px;background:none;border:0;font-size:18px}
.qty span{min-width:30px;text-align:center;font-weight:600}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 5px}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 3px #1B2D5B1a}
textarea{min-height:76px}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.note{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:12px 16px;min-height:46px;border-bottom:2px solid transparent;flex:none;color:var(--mute);font-weight:500}
.tab.on{border-color:var(--gold);color:var(--navy);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line)}
.kpi b{display:block;font-size:26px;color:var(--navy)}
.kpi span{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:500;background:#FAFBFC}
td.n{white-space:nowrap}
.st{border-radius:99px;padding:2px 10px;font-size:13px;white-space:nowrap}
.st-new{background:#C9973B26}.st-ok{background:#1B2D5B1f}.st-ship{background:#E8EEF9}.st-done{background:#1E7A4C24}.st-cancel{background:#B3261E1f}
.mini{width:48px;height:48px;border-radius:10px;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.mini img{width:100%;height:100%;object-fit:contain}.mini svg{width:70%}
.vrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;margin-bottom:6px}
.vrow button{border:1px solid var(--line);background:#fff;border-radius:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar .chips{border:0;margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.demo{background:#C9973B1a;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;color:var(--goldInk)}
.install{position:fixed;inset-inline:12px;bottom:12px;z-index:45;background:#fff;border-radius:16px;box-shadow:0 12px 40px #0003;padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:520px;margin-inline:auto}
.install[hidden]{display:none}
.install img{width:44px;height:44px;border-radius:10px}
.install div{flex:1;display:flex;flex-direction:column;line-height:1.35}
.install span{font-size:13px;color:var(--mute)}
.install .btn{min-height:40px;padding:6px 14px}
@media(display-mode:standalone){#install{display:none!important}}
.pwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.pside{position:sticky;top:76px;background:#fff;border-radius:var(--r);padding:8px;box-shadow:0 1px 0 var(--line);max-height:calc(100vh - 96px);overflow:auto}
.pcat,.psub{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:9px 10px;min-height:40px;font-weight:500}
.psub{font-size:14px;padding-inline-start:22px;color:var(--mute)}
.pcat span,.psub span{color:var(--mute);font-size:13px}
.pcat:hover,.psub:hover{background:var(--bg)}
.pcat.on,.psub.on{background:var(--navy);color:#fff}.pcat.on span,.psub.on span{color:#C9D1E6}
.pgroup{margin-bottom:18px}.pgh{display:flex;justify-content:space-between;align-items:center;padding:6px 4px}
.phid td{opacity:.55}
.bulkbar{position:sticky;top:70px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bulkbar select{max-width:200px;min-height:40px;color:var(--ink);background:#fff}.bulkbar .btn{min-height:40px;padding:6px 14px}
.bulkbar .btn.alt{background:transparent;color:#fff;border-color:#ffffff55}
@media(max-width:800px){.pwrap{grid-template-columns:1fr}.pside{position:static;display:flex;overflow-x:auto;gap:4px;max-height:none}.pcat,.psub{width:auto;flex:none;white-space:nowrap}.psubs{display:contents}}

/* Catalogue loading, fastest first: copy saved on this device (instant) → Vercel edge cache (/api/catalog)
   → one database call (shop_catalog) → page-by-page in parallel (if 13-fast-catalog.sql has not been run yet). */
const CAT_KEY='sn-cat-v1';
const readCat=()=>{try{const c=JSON.parse(localStorage.getItem(CAT_KEY)||'null');return c&&c.products&&c.settings&&Date.now()-c.saved<7*864e5?c:null}catch(e){return null}};

const fixP=p=>({desc:'',desc_en:'',tags:[],img:'',...p});
async function fetchCat(fresh){
  if(!fresh){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch('/api/catalog',{signal:ctl.signal});clearTimeout(tm);
    if(r.ok){const j=await r.json();if(j&&Array.isArray(j.products))return j}}catch(e){}}
  try{const r=await sb.rpc('shop_catalog');if(r&&!r.error&&r.data&&Array.isArray(r.data.products))return r.data}catch(e){}
  const [st,pr]=await Promise.all([sb.from('settings').select('data').eq('id',1).maybeSingle(),allProducts()]);
  if(st.error||pr.error)throw st.error||pr.error;
  return{settings:st.data?st.data.data:null,products:pr.data.map(x=>x.data).filter(x=>x.visible!==false)}}
function applyCat(c){if(c.settings)db.settings=c.settings;db.products=c.products.map(fixP);
  cart=cart.filter(c=>{const x=db.products.find(p=>p.id===c.pid);if(!x||x.ask||!x.visible)return false;
    if(c.label!=null&&(!x.vars[c.vi]||x.vars[c.vi].label!==c.label)){const k=x.vars.findIndex(v=>v.label===c.label);if(k<0)return false;c.vi=k;c.k=x.id+'|'+k}
    const v=x.vars[c.vi];if(!v)return false;if(c.label==null)c.label=v.label;c.q=Math.min(c.q,maxQ(v));return c.q>0});keepCart()}

async function allProducts(){const q=from=>sb.from('products').select('data,sort').order('sort').order('id').range(from,from+999);const out=[];
  for(let from=0;;from+=6000){const rs=await Promise.all([0,1,2,3,4,5].map(k=>q(from+k*1000)));const bad=rs.find(r=>r.error);if(bad)return{error:bad.error};

const rowToOrder=r=>({id:r.code,dbid:r.id,date:r.created_at,status:r.status,...r.customer,items:r.items,sub:+r.sub,fee:+r.fee,total:+r.total});

async function reloadAllProducts(){const p=await allProducts();if(!p.error){db.products.splice(0,db.products.length,...p.data.map(r=>r.data));BASE.clear();snap(db.products)}}
/* Save products without undoing stock that changed on the server (online orders) since the panel loaded:
   a quantity the admin did not touch is taken fresh from the server. */
async function persist(list){if(!list.length)return true;
  const ids=list.map(p=>p.id),got=[];for(let k=0;k<ids.length;k+=150){const fr=await sb.from('products').select('data').in('id',ids.slice(k,k+150));if(fr.error){fail('ما انحفظ – تأكد من الاتصال',fr.error);return false}got.push(...fr.data)}
  const fresh=new Map(got.map(r=>[r.data.id,r.data]));
  list.forEach(p=>{const f=fresh.get(p.id),base=BASE.get(p.id);if(!f||!base)return;p.vars.forEach(v=>{if(!base.has(v.label))return;const b=base.get(v.label),fv=f.vars.find(x=>x.label===v.label);if(!fv)return;
    if((v.stock??null)===b&&(fv.stock??null)!==b)v.stock=fv.stock??null})});
  const r=await sb.from('products').upsert(list.map(p=>({id:p.id,sort:Math.max(0,db.products.indexOf(p)),data:p,updated_at:new Date().toISOString()})));
  if(r.error){fail('ما انحفظ – تأكد من الاتصال',r.error);return false}
  list.forEach(p=>{const i=db.products.findIndex(x=>x.id===p.id);if(i<0)db.products.unshift(p);else db.products[i]=p});snap(list);return true}

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function setAppMode(a){const put=(q,k,v)=>{const el=$(q);if(el)el[k]=v};put('#mf','href',a?'admin.webmanifest':'shop.webmanifest');put('#aicon','href',a?'icons/apple-admin.png':'icons/apple-shop.png');put('#atitle','content',a?'SN Admin':'سعيد نزال');put('#insIcon','src',a?'icons/admin-192.png':'icons/shop-192.png');showInstall()}
function showInstall(){const bar=$('#install');let dis={};try{dis=JSON.parse(localStorage.getItem('sn-install-x')||'{}')}catch(e){}
  const a=location.hash==='#admin',key=a?'admin':'shop';if(standalone()||dis[key]||(!deferredInstall&&!isIOS)||(!a&&innerWidth>900)){bar.hidden=true;return}
  $('#insT').textContent=a?'ثبّت لوحة التحكم على موبايلك':(en()?'Install the Said Nazzal app':'ثبّت تطبيق سعيد نزال');
  $('#insS').textContent=isIOS&&!deferredInstall?(en()?'Tap Share, then “Add to Home Screen”':'اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»'):(en()?'Faster ordering, right from your home screen':'اطلب أسرع من شاشتك الرئيسية');
  $('#insGo').textContent=en()?'Install':'تثبيت';$('#insGo').hidden=isIOS&&!deferredInstall;bar.hidden=false}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstall()});
addEventListener('appinstalled',()=>{$('#install').hidden=true;toast(location.hash==='#admin'?'تم تثبيت لوحة التحكم':'تم تثبيت التطبيق')});
$('#insGo').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#install').hidden=true};
$('#insX').onclick=()=>{let dis={};try{dis=JSON.parse(localStorage.getItem('sn-install-x')||'{}')}catch(e){}dis[location.hash==='#admin'?'admin':'shop']=1;try{localStorage.setItem('sn-install-x',JSON.stringify(dis))}catch(e){}$('#install').hidden=true};
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('sw',e));
applyLang();$('#app').innerHTML='<div class="empty">…</div>';
async function geoCountry(){let c=null;try{c=sessionStorage.getItem('sn-geo')}catch(e){}if(c!=null)return c;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),2500);const r=await fetch('/api/geo',{signal:ctl.signal,cache:'no-store'});clearTimeout(tm);if(r.ok)c=(await r.json()).country||''}catch(e){}
  if(c==null){const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';c=tz==='Asia/Amman'?'JO':''}   // lookup unavailable: guess from the device clock, unknown = Jordan
  try{sessionStorage.setItem('sn-geo',c)}catch(e){}return c}
Promise.all([loadShop(),geoCountry()]).then(([ok,c])=>{let saved=null;try{saved=localStorage.getItem('sn-cur')}catch(e){}
  geoOut=!!c&&c!=='JO';cur=saved||(geoOut&&db.settings.usdAuto!==false?'USD':'JOD');applyLang();updCount();if(ok)route()});
if(sb)sb.auth.getSession().then(async({data})=>{if(!data.session)return;const a=await access(data.session.user.id);if(a){acc=a;authed=true;$('#adminBtnW').style.display='';await Promise.all([loadOrders(),reloadAllProducts()]);if(location.hash==='#admin')renderAdmin()}});
}
</script>
</body>
</html>
